  <title>Luba — Lowest Unique Bid Auctions</title>

  <!-- Social/Telegram link previews (Telegram reads og:* tags). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Luba" />
  <meta property="og:title" content="Luba — Lowest Unique Bid Auctions" />
  <meta property="og:description" content="The lowest UNIQUE bid wins. Bid fees from a few Birr — win prizes worth thousands. Provably fair, wallet-fast." />
  <meta property="og:image" content="/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />
</head>  <body>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("luba.theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
      // Scroll + layout stability, established BEFORE first paint:
      // 1) Reserve the scrollbar column up front — pages alternate short
      //    (auth) and long (dashboard), and a scrollbar appearing later
      //    reflowed the whole viewport sideways (the navigation "shake").
      //    (Also on `html` in index.css; this covers the very first paint
      //    while the bundle is still loading.)
      // 2) Take manual ownership of scroll restoration: react-router never
      //    restores scroll, and the app's old post-paint scrollTo(0,0)
      //    painted each new page at the previous offset for a frame before
      //    snapping to top — a visible jerk on every navigation.
      try {
        document.documentElement.style.scrollbarGutter = "stable";
        history.scrollRestoration = "manual";
      } catch (e) {}
    </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
